<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pepino</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== estilos só da página inicial ===== */
    .hero {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 16px 40px;
      text-align: center;
      perspective: 900px;
    }

    /* logo dentro de um anel neon girando */
    .logo-box {
      position: relative;
      width: clamp(180px, 42vw, 280px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      cursor: pointer;
      animation: surgir 1.2s cubic-bezier(.2, .9, .3, 1.3) both;
    }
    .anel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      background:
        conic-gradient(from 0deg, var(--roxo), transparent 30%, var(--roxo-claro) 50%, transparent 80%, var(--roxo)) border-box;
      -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: girar 6s linear infinite;
      filter: drop-shadow(0 0 10px var(--roxo));
    }
    .anel.dois { inset: -16px; opacity: 0.45; animation-duration: 10s; animation-direction: reverse; }
    .anel.tres { inset: -34px; opacity: 0.2; border-style: dashed; background: none; border-color: var(--roxo-claro); animation-duration: 20s; filter: none; }
    .logo-box .nucleo {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(160, 32, 240, 0.35), rgba(5, 0, 8, 0.9) 70%);
      box-shadow: inset 0 0 40px rgba(160, 32, 240, 0.5), 0 0 60px rgba(160, 32, 240, 0.35);
    }
    .logo-box img {
      position: relative;
      width: 78%;
      aspect-ratio: 1;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      transform: translateZ(40px);
      filter: drop-shadow(0 0 16px rgba(160, 32, 240, 0.8));
      transition: transform 0.3s;
    }
    .logo-box.pulo img { animation: pulo 0.5s; }

    /* nome PEPINO com efeito glitch */
    .nome {
      position: relative;
      font-family: var(--fonte-titulo);
      font-weight: 900;
      font-size: clamp(3rem, 15vw, 8rem);
      letter-spacing: clamp(6px, 2vw, 18px);
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 10px var(--roxo), 0 0 30px var(--roxo), 0 0 60px var(--roxo-escuro);
      animation: surgir 1.2s 0.2s cubic-bezier(.2, .9, .3, 1.3) both;
      user-select: none;
      margin-right: calc(-1 * clamp(6px, 2vw, 18px)); /* centraliza compensando o espaçamento */
    }
    .nome::before, .nome::after {
      content: attr(data-texto);
      position: absolute;
      inset: 0;
      opacity: 0.8;
      text-shadow: none;
    }
    .nome::before { color: #ff2bd6; animation: glitch 3s infinite steps(1); }
    .nome::after  { color: #2bd9ff; animation: glitch 3s 0.15s infinite steps(1) reverse; }

    /* tela larga: pinguim do lado do nome */
    @media (min-width: 1250px) {
      .hero { flex-direction: row; gap: clamp(40px, 4vw, 80px); }
      .logo-box { width: clamp(170px, 13vw, 240px); }
      .nome { font-size: clamp(4rem, 6.5vw, 8rem); }
    }

    /* ===== divisória "Acontecendo agora" ===== */
    .agora { max-width: 1000px; margin: 0 auto; padding: 0 20px 64px; }
    .divisoria {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 24px;
      font-family: var(--fonte-titulo); font-size: 0.95rem; letter-spacing: 4px;
      text-transform: uppercase; color: var(--roxo-claro); white-space: nowrap;
    }
    .divisoria::before, .divisoria::after { content: ""; flex: 1; height: 1px; }
    .divisoria::before { background: linear-gradient(90deg, transparent, var(--roxo)); }
    .divisoria::after { background: linear-gradient(90deg, var(--roxo), transparent); }
    .divisoria .ao-vivo {
      width: 10px; height: 10px; border-radius: 50%;
      background: #8dff6a; box-shadow: 0 0 10px #8dff6a; animation: piscar 1.4s infinite;
    }
    @keyframes piscar { 50% { opacity: 0.3; } }

    .eventos { display: grid; gap: 20px; }
    .evento {
      display: grid; grid-template-columns: 1.1fr 1fr;
      background: rgba(10, 0, 20, 0.75);
      border: 1px solid var(--borda); border-radius: 18px; overflow: hidden;
      box-shadow: 0 0 30px rgba(160, 32, 240, 0.2);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    .evento:hover { border-color: var(--roxo-claro); box-shadow: 0 0 40px rgba(160, 32, 240, 0.45); transform: translateY(-4px); }
    .evento .capa { display: block; overflow: hidden; }
    .evento .capa img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 16 / 9; transition: transform 0.5s; }
    .evento:hover .capa img { transform: scale(1.05); }
    .evento .info { padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; align-items: center; }
    .evento .selo {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 12px; border-radius: 999px; border: 1px solid #8dff6a; color: #8dff6a;
      font-family: var(--fonte-titulo); font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase;
    }
    .evento .selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8dff6a; box-shadow: 0 0 8px #8dff6a; animation: piscar 1.4s infinite; }
    .evento.encerrado .selo { border-color: var(--texto-fraco); color: var(--texto-fraco); }
    .evento.encerrado .selo::before { background: var(--texto-fraco); box-shadow: none; animation: none; }
    .evento h3 { font-family: var(--fonte-titulo); font-size: 1.4rem; letter-spacing: 2px; color: #fff; text-shadow: 0 0 12px rgba(160, 32, 240, 0.7); }
    .evento h3 a { color: inherit; text-decoration: none; }
    .evento small { color: var(--texto-fraco); }
    .mini-contador { display: flex; gap: 8px; margin: 4px 0; }
    .mini-contador div {
      min-width: 58px; padding: 8px 6px 6px; border-radius: 10px;
      background: rgba(160, 32, 240, 0.15); border: 1px solid var(--borda);
    }
    .mini-contador b {
      display: block; font-family: var(--fonte-titulo); font-size: 1.4rem; line-height: 1; color: #fff;
      text-shadow: 0 0 10px var(--roxo); font-variant-numeric: tabular-nums;
    }
    .mini-contador span { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--texto-fraco); }
    .evento .acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .evento .acoes .botao { padding: 8px 16px; font-size: 0.75rem; }
    .botao.vazado { background: transparent; }
    @media (max-width: 700px) {
      .evento { grid-template-columns: 1fr; }
      .evento .info { padding: 18px; }
      .mini-contador div { min-width: 52px; }
    }

    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes surgir { from { opacity: 0; transform: scale(0.6); filter: blur(10px); } }
    @keyframes pulo {
      30% { transform: translateZ(40px) scale(1.15) rotate(-8deg); }
      60% { transform: translateZ(40px) scale(0.95) rotate(6deg); }
    }
    @keyframes glitch {
      0%, 86%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
      88% { clip-path: inset(10% 0 60% 0); transform: translate(-6px, 2px); }
      91% { clip-path: inset(55% 0 20% 0); transform: translate(6px, -2px); }
      94% { clip-path: inset(30% 0 40% 0); transform: translate(-3px, 1px); }
      97% { clip-path: inset(70% 0 5% 0);  transform: translate(4px, 0); }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="logo-box" id="logo" title="Clique em mim">
        <span class="anel tres"></span>
        <span class="anel dois"></span>
        <span class="anel"></span>
        <span class="nucleo"></span>
        <img src="images/favicon.png" alt="Logo do Pepino">
      </div>
      <h1 class="nome" data-texto="PEPINO">PEPINO</h1>
    </section>

    <!-- Acontecendo agora: pra adicionar outro evento, copie o bloco <article class="evento">...</article> -->
    <section class="agora">
      <h2 class="divisoria"><span class="ao-vivo"></span>Acontecendo agora</h2>
      <div class="eventos">
        <article class="evento" id="evento-pcv3">
          <a class="capa" href="pcv3.html"><img src="images/pepinocraftv3.png" alt="PepinoCraft v3"></a>
          <div class="info">
            <span class="selo" id="pcv3-status">Votação aberta</span>
            <h3><a href="pcv3.html">PepinoCraft v3</a></h3>
            <small id="pcv3-sub">A votação acaba em</small>
            <div class="mini-contador" id="pcv3-timer">
              <div><b id="t-d">--</b><span>dias</span></div>
              <div><b id="t-h">--</b><span>horas</span></div>
              <div><b id="t-m">--</b><span>min</span></div>
              <div><b id="t-s">--</b><span>seg</span></div>
            </div>
            <small>Previsto para dez/26 a jan/27</small>
            <div class="acoes">
              <a class="botao" id="pcv3-votar" href="https://forms.gle/6Ws1Kw6asQSCwRWd9" target="_blank" rel="noopener">🗳 Votar</a>
              <a class="botao vazado" href="pcv3.html">Ver projeto</a>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    // logo inclina seguindo o mouse (efeito 3D)
    const logo = document.getElementById("logo");
    addEventListener("pointermove", (e) => {
      const x = (e.clientX / innerWidth - 0.5) * 30;
      const y = (e.clientY / innerHeight - 0.5) * -30;
      logo.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
    // contador do PepinoCraft v3 em "Acontecendo agora" (mesma data da página do projeto)
    const FIM_VOTACAO = new Date("2026-11-28T12:00:00-03:00");
    function atualizarEvento() {
      const falta = Math.floor((FIM_VOTACAO - Date.now()) / 1000);
      if (falta <= 0) {
        clearInterval(timerEvento);
        document.getElementById("evento-pcv3").classList.add("encerrado");
        document.getElementById("pcv3-status").textContent = "Votação encerrada";
        document.getElementById("pcv3-sub").style.display = "none";
        document.getElementById("pcv3-timer").style.display = "none";
        document.getElementById("pcv3-votar").style.display = "none";
        return;
      }
      const z = (n) => String(n).padStart(2, "0");
      document.getElementById("t-d").textContent = Math.floor(falta / 86400);
      document.getElementById("t-h").textContent = z(Math.floor((falta % 86400) / 3600));
      document.getElementById("t-m").textContent = z(Math.floor((falta % 3600) / 60));
      document.getElementById("t-s").textContent = z(falta % 60);
    }
    const timerEvento = setInterval(atualizarEvento, 1000);
    atualizarEvento();

    // clicar no pinguim faz ele pular
    logo.addEventListener("click", () => {
      logo.classList.remove("pulo");
      void logo.offsetWidth;
      logo.classList.add("pulo");
    });
  </script>
</body>
</html>
