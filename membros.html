<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membros · Pepino</title>
  <link rel="icon" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .categoria {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 48px 0 20px;
      font-family: var(--fonte-titulo);
      font-size: 1.05rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--roxo-claro);
    }
    .categoria:first-of-type { margin-top: 0; }
    .categoria::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--roxo), transparent); }

    .membros { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .membro { align-items: center; padding: 22px 12px 18px; text-align: center; cursor: pointer; position: relative; }
    .membro .topo { display: flex; flex-direction: column; align-items: center; }
    .membro img {
      width: 110px; height: 110px; aspect-ratio: 1; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--roxo); box-shadow: 0 0 18px rgba(160, 32, 240, 0.5);
      background: #000;
    }
    .membro h3 { margin-top: 12px; }
    .arroba { color: var(--roxo-claro); font-size: 0.8rem; margin-top: 2px; word-break: break-all; }
    .cargos { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
    .cargos span { font-size: 0.72rem; color: var(--texto-fraco); }
    /* cargos do Pepino: verde pepino brilhante */
    .cargos .pepino {
      font-weight: 600;
      color: #8dff6a;
      text-shadow: 0 0 6px rgba(141, 255, 106, 0.7), 0 0 14px rgba(141, 255, 106, 0.35);
      letter-spacing: 0.5px;
    }
    /* fundadores: dourado com coroa */
    .cargos .fundador {
      font-weight: 700;
      color: #ffd54a;
      text-shadow: 0 0 6px rgba(255, 213, 74, 0.75), 0 0 16px rgba(255, 170, 0, 0.4);
      letter-spacing: 0.5px;
    }
    .cargos .fundador::before { content: "👑 "; text-shadow: none; }
    /* fundador antigo (Salame/Calabresa): apagado, coroa na mesma cor do texto */
    .cargos .fundador-antigo::before { content: "👑 "; color: transparent; text-shadow: 0 0 0 var(--texto-fraco); }

    /* Mestre RPG: avermelhado com um brilho leve que pulsa */
    .cargos .mestre {
      color: #ff7a7a;
      font-weight: 600;
      text-shadow: 0 0 4px rgba(255, 90, 90, 0.45);
      animation: brilho-mestre 2.6s ease-in-out infinite;
    }
    .cargos .mestre::before { content: "🔮 "; }
    @keyframes brilho-mestre { 50% { text-shadow: 0 0 6px rgba(255, 90, 90, 0.7), 0 0 12px rgba(255, 60, 60, 0.3); } }

    .dica { font-size: 0.65rem; color: var(--roxo-claro); opacity: 0.6; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase; }

    /* ativos: dão uma subidinha quando passa o mouse */
    .membro { transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; }
    .ativos .membro:hover {
      transform: translateY(-10px);
      border-color: var(--roxo-claro);
      box-shadow: 0 12px 30px rgba(160, 32, 240, 0.35);
    }

    /* ociosos: meio apagados */
    .ociosos .membro { opacity: 0.7; }
    .ociosos .membro img { filter: saturate(0.4); border-color: var(--roxo-escuro); box-shadow: none; }

    /* ex-membros: preto e branco */
    .ex .membro { opacity: 0.5; }
    .ex .membro img { filter: grayscale(1); border-color: #444; box-shadow: none; }

    /* ===== card aberto ===== */
    .membro .extra { display: none; }
    .membro .fechar {
      display: none; position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--roxo-claro);
      background: transparent; color: var(--roxo-claro); font-size: 1.1rem; cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }
    .membro .fechar:hover { background: var(--roxo); color: #fff; }
    .membros .membro.aberto, .ativos .membro.aberto:hover {
      grid-column: 1 / -1;
      cursor: default;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 28px;
      align-items: start;
      text-align: left;
      padding: 32px;
      opacity: 1;
      transform: none;
      border-color: var(--roxo-claro);
      box-shadow: 0 0 40px rgba(160, 32, 240, 0.35);
      animation: abrir-card 0.4s ease;
    }
    .membro.aberto .topo img { width: 180px; height: 180px; }
    .membro.aberto .dica { display: none; }
    .membro.aberto .fechar { display: block; }
    .membro.aberto .extra { display: block; animation: abrir-card 0.5s ease; }
    .extra h4 {
      font-family: var(--fonte-titulo); font-size: 0.8rem; letter-spacing: 3px;
      text-transform: uppercase; color: var(--roxo-claro); margin: 0 0 10px;
    }
    .extra .cargos { margin: 0 0 24px; }
    .extra .cargos span { font-size: 0.9rem; }
    .extra .descricao { color: var(--texto); line-height: 1.6; margin: 0 0 24px; }
    .extra .redes { display: flex; flex-wrap: wrap; gap: 10px; }
    .extra .redes a {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--borda);
      background: rgba(160, 32, 240, 0.12); color: #fff; text-decoration: none; font-size: 0.85rem;
      transition: background 0.25s, border-color 0.25s, transform 0.25s;
    }
    .extra .redes a img { width: 20px; height: 20px; object-fit: contain; border: none; border-radius: 0; box-shadow: none; background: none; }
    .extra .descricao:empty, .extra .redes:empty { min-height: 1.2em; }
    .extra .redes a:hover { background: var(--roxo); border-color: var(--roxo-claro); transform: translateY(-2px); }
    @keyframes abrir-card { from { opacity: 0; transform: scale(0.96); } }
    @media (max-width: 600px) {
      .membros .membro.aberto { grid-template-columns: 1fr; padding: 48px 18px 24px; text-align: center; }
      .extra .cargos { align-items: center; }
      .extra .redes { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="titulo">Membros</h1>

    <h2 class="categoria">Membros ativos</h2>
    <div class="grade membros ativos" id="ativos"></div>

    <h2 class="categoria">Membros ociosos</h2>
    <div class="grade membros ociosos" id="ociosos"></div>

    <h2 class="categoria">Ex-membros</h2>
    <div class="grade membros ex" id="ex"></div>
  </main>

  <script>
    /* ================================================================
       LISTA DE MEMBROS — é só editar aqui.
       nome, foto, arroba: o que aparece no card.
       fundador: true  -> mostra "👑 Fundador Pepino" dourado; senão mostra "Membro Pepino" verde.
       cargos: aparecem só quando o card abre.
               Escreva "*" antes pra ficar com a coroa apagada (ex: "*Fundador Salame").
       descricao: texto que aparece quando o card abre (escreva entre as aspas).
       redes: lista de botões. Cada um é { nome: "Discord", icone: "disc.png", link: "https://..." }
              (icone é uma imagem da pasta images; se não tiver, apague a parte icone).
       Pra mudar alguém de categoria, recorte a linha { ... } e cole na outra lista.
       ================================================================ */
    const MEMBROS = {
      ativos: [
        { nome: "Felipe",  foto: "felipe.webp",  arroba: "@fekkho",        fundador: true, cargos: ["*Fundador Salame"],
          descricao: "eh o feef",
          redes: [
            { nome: "Discord", icone: "disc.png", link: "https://discord.com/users/847913524054851665" },
          ] },
        { nome: "Pedro",   foto: "pedro.webp",   arroba: "@httpspedru",    fundador: true, cargos: ["*Fundador Calabresa"], descricao: "", redes: [] },
        { nome: "Breno",   foto: "breno.webp",   arroba: "@brenex5212",    cargos: ["Membro Salame"], descricao: "", redes: [] },
        { nome: "Leo",     foto: "oleel.png",    arroba: "@leothenard",    cargos: ["Membro Salame", "Mestre RPG"], descricao: "", redes: [] },
        { nome: "Luiz",    foto: "luul.png",     arroba: "@luizz1603",     cargos: ["Membro Salame", "Membro Calabresa", "Mestre RPG"], descricao: "", redes: [] },
        { nome: "Lucas",   foto: "lulas.png",    arroba: "@lucasbcc",      cargos: ["Membro Calabresa"], descricao: "", redes: [] },
        { nome: "Mary",    foto: "mary.webp",    arroba: "@furmelancholy", cargos: ["Membro Calabresa"], descricao: "", redes: [] },
        { nome: "Daniel",  foto: "daad.png",     arroba: "@seupaidecalcinha6026", cargos: ["Membro Calabresa"], descricao: "", redes: [] },
        { nome: "Rodrigo", foto: "rodrigo.webp", arroba: "@rodrekee",      cargos: ["Membro Calabresa"], descricao: "", redes: [] },
        { nome: "Lucão",   foto: "lucao.webp",   arroba: "@ouhkaes",       cargos: [], descricao: "", redes: [] },
      ],
      ociosos: [
        { nome: "Gabi",     foto: "gabi.webp",     arroba: "@gabigrc",   cargos: ["Membro Salame"], descricao: "", redes: [] },
        { nome: "Giovanni", foto: "giovanni.webp", arroba: "@gisicolin", cargos: ["Membro Salame"], descricao: "", redes: [] },
        { nome: "Maria",    foto: "maria.webp",    arroba: "@furyed_",   cargos: ["Membro Salame", "Mestre RPG"], descricao: "", redes: [] },
      ],
      ex: [
        { nome: "Bandeco", foto: "bandeco.png", ex: true, cargos: [], descricao: "", redes: [] },
        { nome: "Fencer",  foto: "bandeco.png", ex: true, cargos: [], descricao: "", redes: [] },
      ],
    };

    /* ---- daqui pra baixo é o código que monta os cards (não precisa mexer) ---- */
    function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    // "Lucão" -> "lucao" (usado no link membros.html#lucao, que já abre o card)
    function slug(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

    // cargos com estilo próprio
    const ESPECIAIS = { "Mestre RPG": "mestre" };

    function cargoHTML(c) {
      if (ESPECIAIS[c]) return `<span class="${ESPECIAIS[c]}">${esc(c)}</span>`;
      return c.startsWith("*") ? `<span class="fundador-antigo">${esc(c.slice(1))}</span>` : `<span>${esc(c)}</span>`;
    }

    function cardHTML(m) {
      const principal = m.ex ? "" : m.fundador
        ? `<span class="fundador">Fundador Pepino</span>`
        : `<span class="pepino">Membro Pepino</span>`;
      const cargos = (m.cargos || []).length
        ? `<h4>Outros cargos</h4><div class="cargos">${m.cargos.map(cargoHTML).join("")}</div>` : "";
      const redes = `<h4>Redes sociais</h4><div class="redes">${(m.redes || [])
            .map((r) => `<a href="${esc(r.link)}" target="_blank" rel="noopener">${r.icone ? `<img src="images/${esc(r.icone)}" alt="">` : ""}${esc(r.nome)}</a>`).join("")}</div>`;
      return `
        <div class="item membro" tabindex="0" id="${slug(m.nome)}">
          <button class="fechar" type="button" aria-label="Fechar">×</button>
          <div class="topo">
            <img src="images/${esc(m.foto)}" alt="">
            <h3>${esc(m.nome)}</h3>
            ${m.arroba ? `<div class="arroba">${esc(m.arroba)}</div>` : ""}
            ${principal ? `<div class="cargos">${principal}</div>` : ""}
            <div class="dica">clique para ver mais</div>
          </div>
          <div class="extra">
            ${cargos}
            <h4>Descrição</h4><p class="descricao">${esc(m.descricao || "")}</p>
            ${redes}
          </div>
        </div>`;
    }

    Object.entries(MEMBROS).forEach(([grupo, lista]) => {
      document.getElementById(grupo).innerHTML = lista.map(cardHTML).join("");
    });

    // abrir/fechar
    function abrirCard(card) {
      if (card.classList.contains("aberto")) return;
      document.querySelectorAll(".membro.aberto").forEach((c) => c.classList.remove("aberto"));
      card.classList.add("aberto");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    // link tipo membros.html#felipe abre o card direto
    function abrirPeloLink() {
      const card = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (card && card.classList.contains("membro")) {
        card.classList.add("aparecer", "visivel");
        setTimeout(() => abrirCard(card), 150);
      }
    }
    addEventListener("hashchange", abrirPeloLink);
    addEventListener("load", abrirPeloLink);

    document.querySelectorAll(".membro").forEach((card) => {
      const abrir = () => abrirCard(card);
      card.addEventListener("click", (e) => {
        if (e.target.closest(".fechar")) { card.classList.remove("aberto"); return; }
        if (e.target.closest("a")) return;
        abrir();
      });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter") abrir();
        if (e.key === "Escape") card.classList.remove("aberto");
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
